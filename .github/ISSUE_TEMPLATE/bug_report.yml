name: Bug Report
description: Create a report to help us improve the engine (rendering, ECS, server, etc.)
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please provide as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Engine Version or Commit Hash
      description: What version of Archura Engine are you using? (e.g., commit hash, v1.0)
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: Which engine system does this affect?
      description: Select the core module where the bug occurs.
      options:
        - Core Engine / Memory
        - Rendering (OpenGL/fast_obj/Skybox)
        - ECS (Entity Component System)
        - Physics
        - C# Scripting (Mono)
        - Networking / Server
        - ImGui / DevConsole
        - Other / Not Sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior. Please provide minimal code snippets if possible.
      value: |
        1. Create a scene with...
        2. Attach a C# Script containing...
        3. Run the engine...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Logs or Screenshots
      description: Paste any relevant output from 'crash_log.txt', the development console, or upload screenshots here.
    validations:
      required: false
